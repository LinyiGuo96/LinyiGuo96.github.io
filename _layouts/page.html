---
layout: default
---
<header class="page-head wrap">
  {% if page.eyebrow %}<p class="eyebrow" data-reveal>{{ page.eyebrow }}</p>{% endif %}
  <h1 class="page-head__title" data-reveal>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="page-head__sub" data-reveal>{{ page.subtitle }}</p>{% endif %}
</header>

<div class="wrap">
  <div class="prose">
    {{ content }}
  </div>
</div>

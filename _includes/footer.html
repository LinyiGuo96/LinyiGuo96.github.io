<footer class="footer">
  <div class="wrap">
    <div class="footer__top">
      <p class="footer__tagline">{{ site.tagline }}</p>
      <nav class="footer__links" aria-label="Footer">
        {% for item in site.nav %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}
      </nav>
      {% include social.html %}
    </div>
    <div class="footer__mark" aria-hidden="true">LINCOLN GUO</div>
    <div class="footer__bottom">
      <span>© {{ site.time | date: '%Y' }} {{ site.title }} · {{ site.title_zh }}</span>
      <span>Built with Jekyll · Hosted on GitHub Pages</span>
    </div>
  </div>
</footer>

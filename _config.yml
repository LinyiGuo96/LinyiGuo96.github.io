title: Lincoln Guo
title_zh: 郭林怡
tagline: Life is not a zero-sum game.
description: >-
  Lincoln Guo (郭林怡) — capital markets technologist working on structured
  products, trading systems and data. Notes on data engineering, machine learning, quant finance and life.
url: "https://linyiguo96.github.io"
baseurl: ""
lang: en

author:
  name: Lincoln Guo
  email: lincoln.gly@gmail.com

# Shown under the name on the home hero
role: Capital Markets · Trading Tech · Data

# Main navigation
nav:
  - title: Blog
    url: /blog/
  - title: About
    url: /about/
  - title: Moments
    url: /photos/

social:
  github: LinyiGuo96
  linkedin: lincolnguo
  email: lincoln.gly@gmail.com

# Hero media. Leave `video` empty to use the generative canvas animation.
# To use a video instead, drop an mp4 (ideally < 8 MB, 1080p, muted) into
# /assets/video/ and point `video` at it; `poster` is shown while it loads.
hero:
  video: ""
  poster: ""

# --- Services ---
gtag: "G-BGNPCMS6BH"

giscus:
  repo: LinyiGuo96/LinyiGuo96.github.io
  repo_id: MDEwOlJlcG9zaXRvcnkzNjc5OTA4NzA=
  category: General
  category_id: DIC_kwDOFe8YVs4Croxg

# --- Build ---
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

timezone: "America/Toronto"
markdown: kramdown
highlighter: rouge
# Keep the old post URLs so existing links and giscus threads keep working
permalink: /:year-:month-:day-:title/

kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/og.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .idea
  - .Rhistory
  - "*.Rhistory"
  - vendor
